apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker
  namespace: kongfu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaker
  template:
    metadata:
      labels:
        app: matchmaker
    spec:
      containers:
        - name: matchmaker
          image: kongfu-app
          imagePullPolicy: IfNotPresent
          command: ["java", "-cp", "out:lib/*", "app.MatchmakerMain"]
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: POSTGRES_URL
              value: jdbc:postgresql://postgres:5432/kongfu?user=kongfu&password=kongfu
            - name: REDIS_URL
              value: redis://redis:6379
            - name: HEALTH_PORT
              value: "8083"
          ports:
            - containerPort: 8083
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaker
  namespace: kongfu
spec:
  selector:
    app: matchmaker
  ports:
    - port: 8083
      targetPort: 8083
