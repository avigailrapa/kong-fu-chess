apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
  namespace: kongfu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-gateway
  template:
    metadata:
      labels:
        app: ws-gateway
    spec:
      containers:
        - name: ws-gateway
          image: kongfu-app
          imagePullPolicy: IfNotPresent
          command: ["java", "-cp", "out:lib/*", "app.WsGatewayMain"]
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: REDIS_URL
              value: redis://redis:6379
            - name: WS_PORT
              value: "8887"
            - name: HEALTH_PORT
              value: "8081"
          ports:
            - containerPort: 8887
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ws-gateway
  namespace: kongfu
spec:
  type: LoadBalancer
  selector:
    app: ws-gateway
  ports:
    - name: ws
      port: 8887
      targetPort: 8887
    - name: health
      port: 8081
      targetPort: 8081
