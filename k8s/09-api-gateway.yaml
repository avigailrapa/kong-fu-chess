apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kongfu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: kongfu-app
          imagePullPolicy: IfNotPresent
          command: ["java", "-cp", "out:lib/*", "app.ApiGatewayMain"]
          env:
            - name: POSTGRES_URL
              value: jdbc:postgresql://postgres:5432/kongfu?user=kongfu&password=kongfu
            - name: REDIS_URL
              value: redis://redis:6379
            - name: API_PORT
              value: "8080"
            - name: HEALTH_PORT
              value: "8085"
          ports:
            - containerPort: 8080
            - containerPort: 8085
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kongfu
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: health
      port: 8085
      targetPort: 8085
