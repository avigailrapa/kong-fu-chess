apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-allocator
  namespace: kongfu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-allocator
  template:
    metadata:
      labels:
        app: game-allocator
    spec:
      containers:
        - name: game-allocator
          image: kongfu-app
          imagePullPolicy: IfNotPresent
          command: ["java", "-cp", "out:lib/*", "app.GameAllocatorMain"]
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: REDIS_URL
              value: redis://redis:6379
            - name: GAME_NODE_IDS
              value: node-1,node-2
            - name: HEALTH_PORT
              value: "8084"
          ports:
            - containerPort: 8084
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: game-allocator
  namespace: kongfu
spec:
  selector:
    app: game-allocator
  ports:
    - port: 8084
      targetPort: 8084
